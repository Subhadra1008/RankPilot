<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          var currentFetch = typeof rawFetch === 'function' ? rawFetch.bind(window) : rawFetch;

          // 1. Ensure Window.prototype has a setter if fetch is defined there
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && !protoDesc.set) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (eProto) {}
          }

          // 2. Ensure window has an own property with both getter and setter
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch setter init failed:', e);
        }
      })();
    </script>
